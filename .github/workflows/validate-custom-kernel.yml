name: Validate custom sing-box kernel

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - singbox-manager.sh
      - install.sh
      - README.md
      - modules/monitor.sh
      - modules/common.sh
      - modules/firewall.sh
      - modules/node.sh
      - modules/subscription.sh
      - modules/user.sh
      - modules/zz_singbox_114.sh
      - scripts/diagnose.sh
      - scripts/validate_all.sh
      - scripts/validate_custom_kernel_build.sh
      - scripts/validate_kernel_preflight.sh
      - .github/workflows/validate-custom-kernel.yml

permissions:
  contents: read

jobs:
  linux-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.12
          cache: false
      - name: Validate shell syntax and preflight
        run: |
          bash -n modules/zz_singbox_114.sh
          bash scripts/validate_kernel_preflight.sh
      - name: Build real custom kernel
        env:
          SINGBOX_BUILD_TEST_VERSION: 1.13.15
          SINGBOX_BUILD_TEST_OUTPUT: ${{ runner.temp }}/sing-box-custom
        run: bash scripts/validate_custom_kernel_build.sh
      - name: Validate ordinary and custom kernel behavior
        env:
          SINGBOX_VALIDATION_BIN: ${{ runner.temp }}/sing-box-custom
        run: bash scripts/validate_all.sh
