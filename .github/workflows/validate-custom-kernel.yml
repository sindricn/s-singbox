name: Validate custom sing-box kernel

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - modules/zz_singbox_114.sh
      - scripts/validate_custom_kernel_build.sh
      - scripts/validate_kernel_preflight.sh
      - .github/workflows/validate-custom-kernel.yml

permissions:
  contents: read

jobs:
  linux-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache: false
      - name: Validate shell syntax and preflight
        run: |
          bash -n modules/zz_singbox_114.sh
          bash scripts/validate_kernel_preflight.sh
      - name: Build real custom kernel
        env:
          SINGBOX_BUILD_TEST_VERSION: 1.13.15
        run: bash scripts/validate_custom_kernel_build.sh
